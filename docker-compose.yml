name: retro-cloud

x-app-env: &app-env
  NODE_ENV: development
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: mysql://${MYSQL_USER:?Run npm run env:init}:${MYSQL_PASSWORD:?Run npm run env:init}@mysql:3306/${MYSQL_DATABASE:?Run npm run env:init}
  STORAGE_ACCOUNT_NAME: ${STORAGE_ACCOUNT_NAME:?Run npm run env:init}
  STORAGE_ACCOUNT_KEY: ${STORAGE_ACCOUNT_KEY:?Run npm run env:init}
  STORAGE_BLOB_ENDPOINT: http://azurite:10000/${STORAGE_ACCOUNT_NAME}
  STORAGE_CONTAINER_SAVES: ${STORAGE_CONTAINER_SAVES:-saves}
  STORAGE_CONTAINER_CAPTURES: ${STORAGE_CONTAINER_CAPTURES:-captures}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run npm run env:init}
      MYSQL_USER: ${MYSQL_USER:?Run npm run env:init}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run env:init}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run env:init}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--silent", "--disableProductStyleUrl"]
    environment:
      AZURITE_ACCOUNTS: ${STORAGE_ACCOUNT_NAME}:${STORAGE_ACCOUNT_KEY}
    ports:
      - "127.0.0.1:${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(2000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: retro-cloud-local:phase1
    command: ["npm", "run", "db:migrate"]
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  storage-init:
    image: retro-cloud-local:phase1
    build: .
    command: ["node", "--import", "tsx", "scripts/init-storage.ts"]
    environment: *app-env
    depends_on:
      azurite:
        condition: service_healthy
    restart: "no"

  api:
    image: retro-cloud-local:phase1
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  azurite-data:
