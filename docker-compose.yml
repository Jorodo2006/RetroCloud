name: retro-cloud

x-app-env: &app-env
  NODE_ENV: development
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: mysql://${MYSQL_USER:?Run npm run env:init}:${MYSQL_PASSWORD:?Run npm run env:init}@mysql:3306/${MYSQL_DATABASE:?Run npm run env:init}
  STORAGE_ROOT: /data/storage
  JWT_SECRET: ${JWT_SECRET:?Run npm run env:init}
  REGISTRATION_MODE: ${REGISTRATION_MODE:-first-user}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run npm run env:init}
      MYSQL_USER: ${MYSQL_USER:?Run npm run env:init}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run env:init}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run env:init}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    build: .
    image: retro-cloud-local:phase3
    command: ["npm", "run", "db:migrate"]
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  storage-init:
    image: retro-cloud-local:phase3
    build: .
    command: ["node", "--import", "tsx", "scripts/init-storage.ts"]
    environment: *app-env
    volumes:
      - storage-data:/data/storage
    restart: "no"

  api:
    image: retro-cloud-local:phase3
    build: .
    environment: *app-env
    volumes:
      - storage-data:/data/storage
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent:
    image: retro-cloud-local:phase3
    build: .
    profiles: ["agent"]
    command: ["node", "agent/dist/main.js", "run"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_API_URL: http://api:3000
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_DEVICE_ID: ${AGENT_DEVICE_ID:-}
      AGENT_ROMS_ROOT: /roms
      AGENT_STATE_ROOT: /data/agent
      AGENT_LIBRARY_CONFIG: /config/library.json
      AGENT_SCAN_INTERVAL_SECONDS: ${AGENT_SCAN_INTERVAL_SECONDS:-300}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-15}
      AGENT_MAX_FILES: ${AGENT_MAX_FILES:-100000}
    volumes:
      - type: bind
        source: ${AGENT_ROMS_ROOT:-./data/roms}
        target: /roms
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_LIBRARY_CONFIG:-./agent/library.example.json}
        target: /config/library.json
        read_only: true
        bind:
          create_host_path: false
      - agent-data:/data/agent
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  mysql-data:
  storage-data:
  agent-data:
